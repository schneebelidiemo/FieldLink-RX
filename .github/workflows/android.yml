name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build installable test APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk FieldLink-RX-0.1.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldLink-RX-Android-14
          path: FieldLink-RX-0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

